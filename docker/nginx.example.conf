# ──────────────────────────────────────────────────────────────────────────
# Example nginx reverse-proxy config for Modlight (e.g. behind aaPanel).
# The settings that matter for large files (without them nginx applies its
# 1MB default body limit -> 413 on large uploads, and 60s timeouts -> 504 on
# slow uploads):
#   * client_max_body_size 0      -> no upload size cap (app enforces its own)
#   * proxy_request_buffering off  -> stream the body to the app, don't buffer
#                                     the whole multi-GB file to disk/RAM first
#   * long proxy timeouts          -> slow links / big files are not cut off
# ──────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name example.com;
    # (Add your TLS / 443 block as usual; aaPanel manages certs.)

    # Never cap upload size at the proxy — the app decides.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the request body straight through to the app (do NOT buffer).
        proxy_request_buffering off;
        proxy_buffering off;

        # Don't cut off slow/large uploads or long range downloads.
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        send_timeout          3600s;
    }
}
