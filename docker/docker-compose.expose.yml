# Loaded by setup.sh only when you run your own reverse proxy instead of the
# bundled Caddy (COMPOSE_FILE in .env lists it after docker-compose.prod.yml).
#
# Publishes the app on the host so that proxy can reach it. 127.0.0.1 by
# default: the app speaks plain HTTP and trusts X-Real-IP from whoever connects,
# so it must never be reachable from the internet except through the proxy.
# Point the proxy at http://127.0.0.1:${APP_PORT} - docker/nginx.example.conf
# has a complete nginx server block.

services:
  app:
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
