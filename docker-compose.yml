# Dev convenience: a local PostgreSQL for `pnpm dev`.
#   docker compose up -d
# The full production stack (app + postgres + caddy) lives in docker/ and is
# added in the deploy phase.
services:
  postgres:
    image: postgres:17-alpine
    container_name: modlight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modlight
      POSTGRES_PASSWORD: modlight
      POSTGRES_DB: modlight
    ports:
      # Host 5433 -> container 5432 (avoids clashing with a local Postgres on 5432).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modlight -d modlight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
